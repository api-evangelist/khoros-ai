apis:
- aid: khoros-ai:community
  name: Khoros Community API
  description: >-
    The Lithium/Khoros Community platform API. Version 2 is driven by LiQL (Lithium Query Language), a
    SQL-like query language over community objects such as messages, users, boards and categories; the
    legacy v1 REST API remains available under /restapi/vc/. Both are served per community instance —
    the URLs here point at Khoros' own Atlas community. The developer documentation for Community and
    for the newer Aurora platform (which adds a GraphQL API) sits behind an Atlas login.
  humanURL: >-
    https://developer.khoros.com/khoroscommunitydevdocs/reference/khoros-communities-platform-apis
  baseURL: https://community.khoros.com/api/2.0
  tags:
  - Community
  - Forums
  - Content
  properties:
  - type: Documentation
    url: https://developer.khoros.com/khoroscommunitydevdocs/docs/development-guides
  - type: Reference
