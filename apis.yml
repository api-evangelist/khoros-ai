aid: khoros-ai
name: Khoros
description: 'Khoros is the enterprise online-community and social-customer-engagement platform formed
  when Lithium Technologies merged with Spredfast in 2018; the combined company rebranded as Khoros in
  2019 and is today operated by IgniteTech. This record was listed as Lithium until 2026-09-24, and it
  also carries the Spredfast product line (Khoros Marketing). The Lithium name is still load-bearing in
  the live platform: the Khoros Care APIs are served from *.response.lithium.com and api.app.lithium.com,
  the Community plugin SDK and CLI ship on npm as lithium-sdk (the `li` command), and the public GitHub
  organization is still github.com/lithiumtech. The platform exposes four public developer surfaces documented
  at developer.khoros.com — Khoros Care (agent, author, conversation, bot, work-queue, analytics and GDPR
  APIs on the Lithium hosts), Khoros Marketing (the Spredfast-lineage Conversations, CRM, Stream, label-set
  and notification APIs on api.spredfast.com), Khoros Flow (the flow.ai bot and messaging REST API), and
  Khoros Community (the LiQL-powered Community v2 API plus the legacy v1 REST API), with the newer Aurora
  community platform adding a GraphQL API behind a login.'
url: https://raw.githubusercontent.com/api-evangelist/khoros-ai/refs/heads/main/apis.yml
